<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokeLoggd</title>

    <link rel="stylesheet" href="css/style.css" />
    <script src="js/app.js" defer></script>
  </head>

  <body>
    <header>
      <h1>PokeLoggd</h1>

      <nav aria-label="Menu principal">
        <ul>
          <li><a href="#">Início</a></li>
          <li><a href="#">Pokédex</a></li>
          <li><a href="#">Tipos</a></li>
          <li><a href="#">Equipes</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <h2>Pokédex</h2>

        <div class="grid">
          <article class="card">
            <img src="img/001.png" alt="Bulbasaur" />
            <h3>Bulbasaur</h3>
            <p>Nº 0001</p>
          </article>

          <article class="card">
            <img src="img/002.png" alt="Ivysaur" />
            <h3>Ivysaur</h3>
            <p>Nº 0002</p>
          </article>

          <article class="card">
            <img src="img/003.png" alt="Venusaur" />
            <h3>Venusaur</h3>
            <p>Nº 0003</p>
          </article>
        </div>
      </section>
    </main>

    <footer>
      <p>PokeLoggd</p>
    </footer>
  </body>
</html>
